<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#15191e"><meta name="description" content="Moto Enduro: esquiva obstáculos y supera tu récord."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><title>Moto Enduro</title><style>
:root{color-scheme:dark;--bg:#15191e;--panel:#222a32;--text:#f6f7f8;--muted:#b8c0c8;--accent:#ff7a18}*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);color:var(--text);font-family:system-ui,Arial,sans-serif;text-align:center}main{max-width:560px;margin:auto}.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0 12px}.brand img{width:48px;height:48px}.brand h1{font-size:24px;margin:0}.hud{display:flex;justify-content:space-between;background:var(--panel);border-radius:14px;padding:12px 16px;margin-bottom:10px;font-weight:800}.track{position:relative;height:min(58vh,440px);min-height:320px;overflow:hidden;border-radius:20px;background:linear-gradient(90deg,#555 0 8%,#30363c 8% 92%,#555 92%);border:2px solid #59616a;touch-action:manipulation}.track:before{content:"";position:absolute;inset:-100% 0;background:repeating-linear-gradient(180deg,transparent 0 36px,rgba(255,255,255,.24) 36px 51px);background-size:100% 82px;animation:road .5s linear infinite}@keyframes road{to{background-position:0 82px}}.lane{position:absolute;top:0;bottom:0;left:50%;border-left:3px dashed #aeb5bc;opacity:.35}.bike{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:48px;z-index:3;filter:drop-shadow(0 3px 2px #111);user-select:none}.rock{position:absolute;top:-48px;font-size:34px;z-index:2;user-select:none}.controls{display:flex;gap:10px;justify-content:center;margin-top:12px}.controls button{flex:1;max-width:130px;min-height:56px;border:1px solid #58616a;border-radius:15px;background:var(--panel);color:var(--text);font-size:23px;font-weight:800}#start{background:var(--accent);border-color:var(--accent);color:#171717;font-size:17px;max-width:180px}p{color:var(--muted);font-size:14px;line-height:1.45}.hint{margin:12px 0 0}
</style></head><body><main id="app"><div class="brand"><img src="icons/icon-192.png" alt=""><h1>MOTO ENDURO</h1></div><div class="hud"><span>🏁 Puntos: <b id="score">0</b></span><span>🏆 Récord: <b id="best">0</b></span></div><div class="track" id="track" aria-label="Pista de moto"><div class="lane"></div><div class="bike" id="bike">🏍️</div></div><div class="controls"><button id="left" aria-label="Mover izquierda">⬅️</button><button id="start">▶ JUGAR</button><button id="right" aria-label="Mover derecha">➡️</button></div><p id="msg" aria-live="polite">Esquiva las rocas. Toca los lados de la pista o usa las flechas.</p><p class="hint">Juego offline · Hecho para móvil</p></main><script>(()=>{const $=id=>document.getElementById(id),track=$('track'),bike=$('bike'),scoreEl=$('score'),bestEl=$('best'),msg=$('msg'),start=$('start');let x=.5,score=0,best=0,running=false,rocks=[],raf=0,last=0,spawn=0,speed=205;try{best=Number(localStorage.getItem('motoEnduroBest')||0)}catch(e){}bestEl.textContent=best;function move(d){x=Math.max(.12,Math.min(.88,x+d));bike.style.left=(x*100)+'%'}function clearRocks(){rocks.forEach(r=>r.el.remove());rocks=[]}function reset(){clearRocks();score=0;scoreEl.textContent='0';x=.5;move(0);spawn=0;speed=205}function spawnRock(){const el=document.createElement('div');el.className='rock';el.textContent=['🪨','🪵','🌵'][Math.floor(Math.random()*3)];const p=.12+Math.random()*.76;el.style.left=(p*100)+'%';track.appendChild(el);rocks.push({el,x:p,y:-48})}function end(){running=false;cancelAnimationFrame(raf);msg.textContent='💥 ¡Choque! Lograste '+score+' puntos. ¡Inténtalo otra vez!';start.textContent='↻ REINTENTAR'}function loop(t){if(!running)return;const dt=Math.min(.04,(t-last)/1000||0);last=t;spawn+=dt;if(spawn>.72){spawn=0;spawnRock()}for(let i=rocks.length-1;i>=0;i--){const r=rocks[i];r.y+=speed*dt;r.el.style.top=r.y+'px';if(r.y>track.clientHeight){r.el.remove();rocks.splice(i,1);score++;scoreEl.textContent=score;speed=Math.min(330,205+score*2);if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('motoEnduroBest',best)}catch(e){}}}else if(r.y>track.clientHeight-105&&r.y<track.clientHeight-25&&Math.abs(r.x-x)<.105){end();return}}raf=requestAnimationFrame(loop)}function begin(){reset();running=true;msg.textContent='¡Dale! Evita los obstáculos.';start.textContent='🏍️ ¡EN MARCHA!';last=performance.now();raf=requestAnimationFrame(loop)}start.addEventListener('click',()=>{if(!running)begin()});$('left').addEventListener('pointerdown',()=>move(-.09));$('right').addEventListener('pointerdown',()=>move(.09));track.addEventListener('pointerdown',e=>{const r=track.getBoundingClientRect();move((e.clientX-r.left<r.width/2?-1:1)*.11)});window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-.07);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(.07);if(e.code==='Space'&&!running){e.preventDefault();begin()}})})();</script></body></html>
